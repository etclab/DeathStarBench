apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election-key-curator-role
  namespace: default
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get","watch","list","create","update","patch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: leader-election-key-curator-role-binding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-election-key-curator-role
subjects:
- kind: ServiceAccount
  name: istiod
  namespace: istio-system