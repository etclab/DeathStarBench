  name: compose-post-service
  labels:
    socialnetwork/service: compose-post-service
data:
  jaeger-config.yml: |
    disabled: false
    reporter:
      logSpans: false
      localAgentHostPort: "jaeger:6831"
      queueSize: 1000000
      bufferFlushInterval: 10
    sampler:
      type: "probabilistic"
      param: 0.01
  service-config.json: |
