# HPAs for the SocialNetwork stateless tier -- the churn knob for the
# Istio vs Mazu comparison. Counterpart to scratch/yaml/bf-hpa.yaml, which
# does the same job for Bookinfo in run-benchmark1.5b-sweep.sh.
#
# WHY BOTH CONTAINERS
#   Each HPA scales on the APP container's CPU and on the istio-proxy
#   sidecar's CPU, both targeting 70% utilization. This is the ORIGINAL
#   sizing metric, restored deliberately.
#
#   autoscaling/v2 evaluates every metric in the list independently, derives a
#   replica recommendation from each, and takes the MAX. So either container
#   crossing 70% of its OWN request scales the deployment out, which is the
#   "scale up if either one is over 70%" behaviour this is meant to have. Note
#   the corollary: scale-DOWN requires BOTH to be under target, so the busier
#   container alone governs the fleet in practice.
#
# WHAT THE SIDECAR METRIC COSTS AN ISTIO-VS-MAZU COMPARISON
#   Read this before attributing any fleet-size difference to the meshes.
#   With this metric live, fleet size becomes a function of the mesh under
#   test, and the comparison acquires a circularity:
#
#     Mazu's proxy carries RBE and attestation work that stock Envoy does not
#     -> it burns more sidecar CPU -> the HPA hands Mazu more pods -> the
#     larger fleet absorbs the latency -> Mazu scores as comparable.
#
#   Sidecar CPU is also the quantity collect_metrics_sn.sh MEASURES
#   (plot_sn_cpu.dat), so it is now both an input to the independent variable
#   and a reported outcome. That is a legitimate experiment -- "how much
#   bigger a fleet does each mesh demand at a fixed offered load" -- but it is
#   NOT a like-for-like latency comparison at equal fleet size. Do not read
#   the two as if they were the same figure.
#
#   Measured on results/sn-sweep-09-02-26_203058, with this metric live: the
#   two arms' fleets diverged 2.6x (55 vs 143 ready pods at 600 RPS). Over the
#   same steps the app-container CPU ratio was 1.03-1.08 -- app CPU sits
#   within 8% between the meshes wherever both arms deliver the offered load,
#   so an app-only HPA is the mesh-INDEPENDENT alternative if that is what a
#   given figure needs.
#
#   THE SIDECAR METRIC DOMINATES. Utilization is usage/request. The app
#   containers request 1 CPU via socialnetwork-bench-values.yaml, so 70% trips
#   at 700m. The sidecar requests only 100m, so its 70% trips at 70m -- ~10x
#   more sensitive per absolute core. Expect it to drive essentially all of
#   the observed scaling and to produce substantially LARGER fleets: at 1400
#   RPS Istio's 16.96 aggregate app CPU implies ~24 pods of demand at a 700m
#   target, against the ~102 pods the sidecar metric actually produced. Size
#   the cluster for that -- see CEILINGS below.
#
# CAVEAT -- APP CPU IS ONLY MESH-INDEPENDENT AT EQUAL THROUGHPUT
#   This applies to the app-container metric whether or not the sidecar one is
#   live. wrk2 offers a fixed rate, so the two arms do the same app-side work
#   only while both DELIVER that rate. Past an arm's throughput ceiling less
#   traffic reaches its app containers, its app CPU falls, and that metric
#   hands the FAILING arm FEWER pods -- a confound in the opposite direction
#   to the sidecar one above, and the two do not cancel. In the run cited
#   above Mazu saturated at ~785 RPS and its app CPU fell to 0.66x Istio's by
#   1400 RPS. Always read rps_delivered in summary.csv before comparing pod
#   counts across arms at a given step.
#
# WHY NO DATASTORES
#   Only the stateless Thrift services and the nginx/media frontends appear
#   here. The standalone mongo/redis/memcached pods sit behind a single
#   ClusterIP with no replication -- scaling them would spray reads and writes
#   across independent instances and silently corrupt results. See the note in
#   socialnetwork-bench-values.yaml. Use the sharded/cluster topologies if you
#   need those tiers to scale.
#
# WHY minReplicas: 1
#   Churn is the point. Pair this with sn-hpa-values.yaml, which drops the
#   pinned replica counts to 1 so the fleet has somewhere to grow from. The
#   floor here and the chart's replicas MUST match or the first HPA sync
#   immediately rewrites the fleet and the early samples are meaningless.
#
# CEILINGS
#   maxReplicas is DOUBLE the original sizing (sum 302 across the 13 HPAs).
#   The originals bound in BOTH arms -- post-storage-service sat at exactly
#   15/15 for six of eight steps in sn-sweep-09-02-26_203058 -- which censors
#   real demand and hides the very difference the experiment is looking for.
#   A ceiling that is never reached costs nothing; one that binds silently
#   invalidates the step.
#
#   The caps are kept rather than removed because scaleUp below has NO
#   stabilization window and adds 2 pods every 2s. Unbounded, that runs until
#   CPU requests exhaust the cluster (~465 pods at 1.1 CPU/pod against 512
#   schedulable) and the surplus sits Pending -- invisible in a ready-pod
#   count, but still churning the scheduler and apiserver.
#
#   Verify after every run that nothing pegged: the pending/notready columns
#   in pods-<rps>-sum.csv, and deploy-<rps>.txt.
#
# behavior: react on the first sample over threshold (no stabilization window)
# and add 2 pods every 2s, matching bf-hpa.yaml so the two benchmarks are
# directly comparable.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-thrift-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-thrift
  minReplicas: 1
  maxReplicas: 40
  metrics:
  - type: ContainerResource
    containerResource:
      name: cpu
      container: istio-proxy
      target:
        type: Utilization
        averageUtilization: 70
  - type: ContainerResource
    containerResource:
      name: cpu
      container: nginx-thrift
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 2
        periodSeconds: 2
      selectPolicy: Max
---
