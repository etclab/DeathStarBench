# HPAs scale on EITHER istio-proxy CPU > 50% OR the app container CPU > 50%.
# With multiple metrics, HPA computes desiredReplicas for each and takes the
# Max, so whichever container saturates first triggers scale-up.
# Utilization = usage / request; sidecar.istio.io/proxyCPU=4 and the app
# container request=1 (see bookinfo-const.yaml).
#
# behavior block: react on first sample above threshold. Two scale-up policies,
# and HPA picks the one that yields MORE pods (selectPolicy: Max):
#   - Percent 100% / 5s: double replicas every 5s (fast ramp from small counts)
#   - Pods +4 / 15s:     add 4 pods per 15s (stronger when replica count is high)

# details service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: details-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: details-v1
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: ContainerResource
    containerResource:
      name: cpu
      container: istio-proxy
      target:
        type: Utilization
        averageUtilization: 70
  - type: ContainerResource
    containerResource:
      name: cpu
      container: details
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      # - type: Percent
      #   value: 50
      #   periodSeconds: 2
      - type: Pods
        value: 2
        periodSeconds: 2
      selectPolicy: Max
---
