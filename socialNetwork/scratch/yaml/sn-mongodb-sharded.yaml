# Arm G: MongoDB sharded topology (mongos + config server + shards).
#
# Layer on top of socialnetwork-bench-values.yaml and sn-images-legacy.yaml:
#   -f socialnetwork-bench-values.yaml -f sn-images-legacy.yaml -f sn-mongodb-sharded.yaml
#
# Requires a generous helm --timeout (10m+); the shard replica sets take a
# while to elect primaries before the post-install sharding hook can run.
#
# WHAT CHANGES IN THE APPLICATION
# -------------------------------
# service-config.tpl swings all six mongodb clients (social-graph, post,
# user, user-timeline, url-shorten, media) from their own dedicated
# mongod to one shared `root:password@mongodb-sharded:27017`.
#
# KEYSPACE SAFETY: verified OK.
#   Each service uses its own database name (social-graph, post, user,
#   user-timeline, url-shorten, media), so mongos routes by db.collection
#   and the services cannot tread on each other. The post-install hook in
#   templates/hooks/mongodb/ enables sharding per collection.
#
# SCALING KNOBS (override with --set from the runner):
#   mongodb-sharded.shards                     -- number of shards
#   mongodb-sharded.shardsvr.dataNode.replicaCount -- replicas per shard
#   mongodb-sharded.mongos.replicaCount        -- number of query routers
#
# NOTE: mongos.replicaCount defaults to 1 in the subchart. Like mcrouter,
# that one pod fronts every database operation in the application, so it is
# a serialization point in its own right. Raised to 3 here.
#
# NOTE ON PERSISTENCE: disabled on purpose. The chart defaults to PVCs, and
# this cluster's only StorageClass is NFS-backed (nfs-subdir-external-
# provisioner). Running mongod's journal over NFS would dominate the
# measurement and make this arm incomparable to the standalone baseline,
# which kept data in the container filesystem. emptyDir keeps the storage
# path identical across arms. THIS MEANS THE DATASET IS STILL VOLATILE --
# the "seed after the last helm upgrade" rule from SOCIALNETWORK-ON-ISTIO.md
# still applies here.

global:
  mongodb:
    standalone:
      enabled: false
    sharding:
      enabled: true
      svc:
        name: "mongodb-sharded"
        user: "root"
        password: "password"
        port: 27017


# ---------------------------------------------------------------------------
# SERVICE ACCOUNT TOKEN: MUST BE MOUNTED, OR THE MAZU ARMS HANG.
#
# mongodb-sharded 9.0.0 ships automountServiceAccountToken: false on every
# pod (configsvr, mongos, shardsvr.dataNode). That strips
# /var/run/secrets/kubernetes.io/serviceaccount from EVERY container in the
# pod -- including the injected istio-proxy.
#
# Plain Istio does not care: it authenticates with its own projected
# `istio-token` volume, which is still mounted. Mazu does care -- its
# ext-authz filter performs a Kubernetes TokenReview and needs the real
# ServiceAccount token. Without it the sidecar comes up Ready and logs:
#
#   warn   failed to fetch token from file: open
#          /var/run/secrets/kubernetes.io/serviceaccount/token: no such file
#   error  ext-authz  failed to get in-cluster config for TokenReview: ...
#
# and then silently fails the data path. Observed 2026-08-27: TCP connect to
# mongodb-sharded-configsvr-0:27017 SUCCEEDS, the MongoDB wire handshake then
# hangs, mongos logs `MongoServerSelectionError: read ECONNRESET` until
# "Node ... did not become available" and CrashLoopBackOffs (10 restarts).
# setup-collection-sharding-hook then retries mongos forever and helm dies
# with `failed post-install: timed out waiting for the condition`.
#
# The symptom points at the hook and at mTLS; the cause is this flag. Note
# the mcrouter/memcached subcharts leave it unset (i.e. true), which is why
# ONLY the mongodb tier broke.
#
# Set here rather than in sn-mazu-annotations*.yaml on purpose: both arms
# then get an identical pod spec and only Mazu actually consumes the token,
# so the Istio-vs-Mazu comparison is not confounded by a config difference.
# ---------------------------------------------------------------------------

mongodb-sharded:
  fullnameOverride: mongodb-sharded
  automountServiceAccountToken: true
  common:
    serviceAccount:
      automountServiceAccountToken: true
  auth:
    rootPassword: "password"
    replicaSetKey: "password"

  shards: 3

  shardsvr:
    dataNode:
      replicaCount: 2
      automountServiceAccountToken: true
      serviceAccount:
        automountServiceAccountToken: true
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 8Gi
    persistence:
      enabled: false

  configsvr:
    replicaCount: 1
    automountServiceAccountToken: true
    serviceAccount:
      automountServiceAccountToken: true
    persistence:
      enabled: false
    resources:
      requests:
        cpu: "500m"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

  mongos:
    replicaCount: 3
    automountServiceAccountToken: true
    serviceAccount:
      automountServiceAccountToken: true
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 4Gi
