{{- if .Values.global.mongodb.sharding.enabled }}
apiVersion: v1
kind: Pod
metadata:
   name: setup-collection-sharding-hook
   annotations:
       "helm.sh/hook": "post-install"
       {{- /*
         This hook runs INSIDE the mesh on purpose: mtls.yaml sets a mesh-wide
         STRICT PeerAuthentication, so a hook with sidecar.istio.io/inject=false
         (as the mcrouter hook uses -- that one only talks to the API server)
         would be rejected by mongos. Being in the mesh means it needs the same
         Mazu sidecar annotations as every other pod, or its sidecar never
         registers with the Key Curator, its mongo connection never succeeds,
         setup_mongo() retries forever, and `helm install` blocks on the hook
         until it times out. See scratch/yaml/sn-mazu-annotations*.yaml.
         Harmless when unset (the plain-Istio arms).
       */}}
       {{- range $k, $v := (.Values.global.podAnnotations | default dict) }}
       {{ $k }}: {{ $v | quote }}
       {{- end }}
spec:
  containers:
  - name: post-install-container
    image: python
    imagePullPolicy: Always
    command: ['sh', '-c', 'python -m pip install pymongo requests && python /tmp/init_social_network.py']  
    volumeMounts:
      - name: mongo-init-script
        mountPath: /tmp
  volumes:
  - name: mongo-init-script
    configMap:
      name: mongo-init-script
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
{{- end }}
