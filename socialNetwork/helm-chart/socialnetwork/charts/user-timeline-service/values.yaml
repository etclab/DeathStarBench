name: user-timeline-service

ports:
  - port: 9090
    targetPort: 9090

container:
  command: UserTimelineService
  image: deathstarbench/social-network-microservices
  name: user-timeline-service
  ports: 
  - containerPort: 9090

configMaps:
  - name: jaeger-config.yml
    mountPath: /social-network-microservices/config/jaeger-config.yml
    value: jaeger-config

  - name: service-config.json
    mountPath: /social-network-microservices/config/service-config.json
    value: service-config

# Construct a redis-plus-plus RedisCluster client eagerly at startup, so this
# service aborts with `sw::redis::Error: Empty slots` if the cluster has not
# formed yet. Makes _baseDeployment.tpl inject the wait-for-redis-cluster
# initContainer; only has an effect when global.redis.cluster.enabled is true.
waitForRedisCluster: true
